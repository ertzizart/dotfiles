[window]
dimensions = { columns = 135, lines = 30 }
padding = { x = 10, y = 8 }
dynamic_padding = true
opacity = 0.7

[font]
normal = { family = "Fira Code", style = "Semibold" }
bold = { family = "Fira Code", style = "Bold" }
italic = { family = "Fira Code", style = "Bold" }
size = 10.0

[colors.primary]
background = "#000000"
foreground = "#fffacd"

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan =  "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue =  "#d6acff"
magenta = "#ff92df"
cyan =  "#a4ffff"
white = "#ffffff"

[cursor]
style = { shape = "underline", blinking = "On" }

[terminal]
osc52 = "CopyPaste"

[general]
live_config_reload = true
